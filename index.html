<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>ZeroTrace Redirector & Referrer Shield</title>
    <meta name="description" content="Privacy-preserving URL redirector, HTTP Referrer-Policy manager, and origin traffic anonymizer." />
    <meta property="og:title" content="ZeroTrace Redirector & Referrer Shield" />
    <meta property="og:description" content="Privacy-preserving URL redirector, HTTP Referrer-Policy manager, and origin traffic anonymizer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Instant Zero-Referrer Static Redirect Handler (Works on GitHub Pages & Any Static Host)
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var encoded = params.get('u') || params.get('to');
          var mode = params.get('m');
          var delay = parseInt(params.get('d') || '0', 10) || 0;
          if (!encoded || mode === 'gate') return;

          var target = null;
          if (/^https?:\/\//i.test(encoded)) {
            target = encoded;
          } else {
            var b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            target = decodeURIComponent(escape(window.atob(b64)));
          }

          if (target && /^https?:\/\//i.test(target)) {
            var triggerRedirect = function () {
              try {
                var a = document.createElement('a');
                a.rel = 'noreferrer noopener';
                a.referrerPolicy = 'no-referrer';
                a.href = target;
                document.body.appendChild(a);
                a.click();
              } catch (e) {
                window.location.replace(target);
              }
            };
            if (delay <= 0) {
              window.addEventListener('DOMContentLoaded', triggerRedirect);
            } else {
              setTimeout(triggerRedirect, delay * 1000);
            }
          }
        } catch (err) {
          // Continue to React app if not a direct redirect query
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-600 selection:text-white">
    <div id="root"></div>
    <script>
      window.__loadGitHubPagesBundle = function () {
        if (window.__ghBundleLoaded) return;
        window.__ghBundleLoaded = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './github-pages-bundle.css';
        document.head.appendChild(link);

        var s = document.createElement('script');
        s.type = 'module';
        s.src = './github-pages-bundle.js';
        document.body.appendChild(s);
      };

      // If hosted on github.io (via static.yml), load the pre-compiled bundle immediately
      if (/github\.io$/i.test(window.location.hostname)) {
        window.__loadGitHubPagesBundle();
      } else {
        // Fallback if raw index.html is served statically without Vite dev server
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.children.length === 0) {
              window.__loadGitHubPagesBundle();
            }
          }, 350);
        });
      }
    </script>
    <script
      type="module"
      src="./src/main.tsx"
      onerror="window.__loadGitHubPagesBundle && window.__loadGitHubPagesBundle()"
    ></script>
  </body>
</html>
